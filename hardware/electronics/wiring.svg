<text x="60" y="520" font-weight="bold">Pin map (XIAO ESP32S3, all 11 GPIO used)</text>
<text x="60" y="542" font-size="12" font-family="Menlo, monospace">D1 / GPIO2        </text>
<text x="200" y="542" font-size="12">I2S BCLK (both mics)</text>
<text x="60" y="560" font-size="12" font-family="Menlo, monospace">D2 / GPIO3        </text>
<text x="200" y="560" font-size="12">I2S LRCL / WS (both mics)</text>
<text x="60" y="578" font-size="12" font-family="Menlo, monospace">D3 / GPIO4        </text>
<text x="200" y="578" font-size="12">I2S DOUT (both mics, L/R via SEL)</text>
<text x="60" y="596" font-size="12" font-family="Menlo, monospace">D7 / GPIO44       </text>
<text x="200" y="596" font-size="12">Button, to GND, INPUT_PULLUP</text>
<text x="60" y="614" font-size="12" font-family="Menlo, monospace">D6 / GPIO43       </text>
<text x="200" y="614" font-size="12">NeoPixel data</text>
<text x="60" y="632" font-size="12" font-family="Menlo, monospace">D4 / GPIO5        </text>
<text x="200" y="632" font-size="12">Haptic driver (optional)</text>
<text x="60" y="650" font-size="12" font-family="Menlo, monospace">D0 / GPIO1        </text>
<text x="200" y="650" font-size="12">VBAT sense via 2x220 kΩ (optional)</text>
<text x="60" y="668" font-size="12" font-family="Menlo, monospace">D5 / GPIO6        </text>
<text x="200" y="668" font-size="12">microSD CS</text>
<text x="60" y="686" font-size="12" font-family="Menlo, monospace">D8 / GPIO7        </text>
<text x="200" y="686" font-size="12">microSD SCK</text>
<text x="60" y="704" font-size="12" font-family="Menlo, monospace">D9 / GPIO8        </text>
<text x="200" y="704" font-size="12">microSD DO (MISO)</text>
<text x="60" y="722" font-size="12" font-family="Menlo, monospace">D10 / GPIO9       </text>
<text x="200" y="722" font-size="12">microSD DI (MOSI)</text>
